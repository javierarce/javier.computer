{% assign previous = include.post.previous -%}
{% assign next = include.post.next -%}
{% if previous.url or next.url -%}
<div class="post__pagination">
  {% if previous.url -%}
  <a class="post__pagination-prev" href="{{ previous.url }}" title="{{ previous.title | escape }}" aria-label="Anterior: {{ previous.title | escape }}">←</a>
  {% else -%}
  <span class="post__pagination-arrow is-disabled" aria-hidden="true">←</span>
  {% endif -%}
  {% if next.url -%}
  <a class="post__pagination-next" href="{{ next.url }}" title="{{ next.title | escape }}" aria-label="Siguiente: {{ next.title | escape }}">→</a>
  {% else -%}
  <span class="post__pagination-arrow is-disabled" aria-hidden="true">→</span>
  {% endif -%}
</div>
{% endif -%}
