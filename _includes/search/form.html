<form class="search-form input-action js-search-form" action="/search" method="get">
  <div class="search-form__field">
    <input
      type="text"
      class="input input--sm js-search-input"
      id="search-box"
      name="q"
      placeholder="Buscar en el blog..."
      aria-label="Buscar en el blog"
      required
    >
    <button
      type="button"
      class="search-form__clear js-search-clear"
      aria-label="Limpiar la búsqueda"
      hidden
    ></button>
  </div>
  <button type="submit" class="button button--solid button--sm">Buscar</button>
</form>
<script src="{{ 'scripts/search-form.js' | relative_url }}?version={{site.version}}" defer></script>
